<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="sb-favicon-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#635BFF" />
      <stop offset="50%" stopColor="#4F46E5" />
      <stop offset="100%" stopColor="#3730A3" />
    </linearGradient>
    <linearGradient id="sb-favicon-shine" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background squircle badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sb-favicon-bg)" stroke="url(#sb-favicon-shine)" stroke-width="1.5" />

  <!-- Subtle ambient glow -->
  <circle cx="14" cy="14" r="10" fill="#FFFFFF" fill-opacity="0.15" />

  <!-- B Vertical Spine -->
  <rect x="13.5" y="11.5" width="4.2" height="25" rx="2.1" fill="#FFFFFF" />

  <!-- B Upper Bowl -->
  <path d="M15.5 12 H26 C30 12 32.5 14.2 32.5 17.5 C32.5 20.8 30 22.8 26 22.8 H15.5" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- B Lower Bowl -->
  <path d="M15.5 22.8 H27.5 C32 22.8 34.5 25 34.5 28.6 C34.5 32.4 31.8 34.5 27 34.5 H15.5" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- S Dynamic Ribbon Weave -->
  <path d="M29 14.5 C25 11.5 19.5 11.5 16 14 C13.2 16 13 19.5 15.5 21.5 C18.5 23.8 29.5 24.2 30.5 28 C31.5 31.8 28 34.5 22 35 C17.5 35.4 13.5 33 11 30.5" fill="none" stroke="#C7D2FE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram Interlocking Node -->
  <circle cx="21" cy="22.8" r="1.2" fill="#818CF8" />
</svg>